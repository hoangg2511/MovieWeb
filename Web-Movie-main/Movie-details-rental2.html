<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviePortal</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"> -->
    <link rel="stylesheet" href="Movie-details-rental.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <script src="data-rental2.js"></script>
    <script src="script-rental2.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="PLAYCINE Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#"><img src="home-icon.png" alt=""> Trang chủ</a></li>
                <li><a href="movie-listing.html"><img src="tv-icon.png" alt=""> Kho Phim</a></li>
                <li><a href="/Web-Movie-main/Movie-series.html"><img src="sports-icon.png" alt=""> Phim Bộ</a></li>
                <li><a href="rental-movie.html"><img src="kids-icon.png" alt=""> Thiếu nhi</a></li>
                <li><a href="theaterMovies-list.html"><img src="kids-icon.png" alt=""> Phim chiếu rạp</a></li>
            </ul>
            <div class="search-bar">
                <input type="text" placeholder="What are you looking for">
            </div>
            <div class="icons">
                <span>🔔</span>
                <div class="user-container">
                    <span class="user-icon">👤</span>
                    <div class="user-menu">
                        <p><a href="./adminpage.html">Profile</a></p>
                        <p><a href="#">Settings</a></p>
                        <p><a href="/Web-Movie-main/signin.html">Log out</a></p>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- Video Player Section -->
    <div class="video-container">
        <div id="video-overlay" class="video-overlay">
            <button id="play-button" class="play-button">
                <svg xmlns="" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="10 8 16 12 10 16 10 8" />
                </svg>
            </button>
        </div>
        <div id="video-player"></div>
    </div>

    <!-- Movie Details -->
    <div class="container">
        <div class="movie-details">
            <div class="movie-info">
                <h1 id="movie-title"></h1>
                <div class="movie-meta">
                    <div class="rating">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon
                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                        </svg>
                        <span id="movie-rating"></span>
                    </div>
                    <span class="separator">|</span>
                    <span id="movie-duration"></span>
                    <span class="separator">|</span>
                    <span id="movie-year"></span>
                </div>
                <p class="synopsis" id="movie-synopsis"></p>
                <div class="movie-details-grid">
                    <div>
                        <h3>Director</h3>
                        <p id="movie-director"></p>
                    </div>
                    <div>
                        <h3>Cast</h3>
                        <p id="movie-cast"></p>
                    </div>
                    <div>
                        <h3>Genre</h3>
                        <p id="movie-genre"></p>
                    </div>
                    <div>
                        <h3>Production</h3>
                        <p id="movie-production"></p>
                    </div>
                </div>
            </div>
            <div class="movie-poster">
                <img id="movie-poster" src="" alt="Movie Poster">
            </div>
        </div>
    </div>

    <!-- Related Movies Slider -->
    <div class="slider-section">
        <h2>Related Movies</h2>
        <div class="swiper related-movies">
            <div class="swiper-wrapper">
                <!-- Slides will be populated by JavaScript -->
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <!-- Recommended Movies Slider -->
    <div class="slider-section">
        <h2>Recommended Movies</h2>
        <div class="swiper recommended-movies">
            <div class="swiper-wrapper">
                <!-- Slides will be populated by JavaScript -->
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
