<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sign-in-up.css">
    <script src="signin.js"></script>
    <title>PlayCine - Sign In</title>

</head>

<body>
    <header>
        <h1>Unclock a world of endless entertaiment</h1>
        <h3>Login to Discovery, Stream and Enjoy!</h3>
    </header>

    <div class="container">

        <h2>Sign in</h2>
        <form>
            <p>Username</p>
            <input type="email" id="email" placeholder="example.email@gmail.com" required>

            <p>Password</p>
            <input type="password" id="password" placeholder="Enter at least 8+ characters" required>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="link">Forgot password?</a>
            </div>
            <button type="submit"> Sign in</button>
            <!-- <button class="btn-signin"><a href="/Web-Movie-main/home-movieList.html">sign in</a></button> -->

        </form>
        <p class="text-small">New to PlayCine? <a href="/Web-Movie-main/signup.html" class="link"> Signup now</a></p>
    </div>
</body>

</html>
